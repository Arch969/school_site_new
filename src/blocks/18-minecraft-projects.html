<section class="ku-projects ku-projects--student-portfolio" id="minecraft-projects">
  <div class="ku-projects__gridbg"></div>
  <div class="ku-projects__glow ku-projects__glow--blue"></div>
  <div class="ku-projects__glow ku-projects__glow--red"></div>

  <div class="ku-projects__container">
    <div class="ku-projects__head ku-projects__reveal">
      <div class="ku-projects__badge">Портфолио курса Minecraft-моддинга</div>
      <h2 class="ku-projects__title">Игровые предметы <span>учеников</span></h2>
      <p class="ku-projects__text">Ученики придумывают и оформляют собственные предметы, блоки и элементы для Minecraft-проектов.</p>
    </div>

    <div class="ku-projects__slider ku-projects__reveal">
      <button class="ku-projects__nav ku-projects__nav--prev" type="button" aria-label="Предыдущая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.41 12l5.3 5.3a1 1 0 0 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.41 0Z"/></svg></button>
      <div class="ku-projects__viewport">
        <div class="ku-projects__track">
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/minecraft_mod/1.jpg" alt="Грозовой меч — Никита, 10 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Грозовой меч</h3>
              <div class="ku-project-card__meta"><span>Никита</span><span>10 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--violet ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/minecraft_mod/2.jpg" alt="Сапфировый блок — Наталья, 11 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Сапфировый блок</h3>
              <div class="ku-project-card__meta"><span>Наталья</span><span>11 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--orange ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/minecraft_mod/3.jpg" alt="Магическое яблоко — Степан, 12 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Магическое яблоко</h3>
              <div class="ku-project-card__meta"><span>Степан</span><span>12 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/minecraft_mod/4.jpg" alt="Магическая руда — Виталий, 9 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Магическая руда</h3>
              <div class="ku-project-card__meta"><span>Виталий</span><span>9 лет</span></div>
            </div>
          </article>
        </div>
      </div>
      <button class="ku-projects__nav ku-projects__nav--next" type="button" aria-label="Следующая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 18.7a1 1 0 0 1 0-1.4l5.29-5.3L9.3 6.7a1 1 0 1 1 1.42-1.4l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-1.41 0Z"/></svg></button>
    </div>
    <div class="ku-projects__dots" aria-label="Навигация по работам"></div>
  </div>
</section>
