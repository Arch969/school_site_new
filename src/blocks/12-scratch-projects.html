<section class="ku-projects ku-projects--student-portfolio" id="scratch-projects">
  <div class="ku-projects__gridbg"></div>
  <div class="ku-projects__glow ku-projects__glow--blue"></div>
  <div class="ku-projects__glow ku-projects__glow--red"></div>

  <div class="ku-projects__container">
    <div class="ku-projects__head ku-projects__reveal">
      <div class="ku-projects__badge">Портфолио курса Scratch</div>
      <h2 class="ku-projects__title">Портфолио <span>учеников Scratch</span></h2>
      <p class="ku-projects__text">Настоящие проекты детей: игры, аркады и интерактивные истории, которые ребёнок собирает на занятиях.</p>
    </div>

    <div class="ku-projects__slider ku-projects__reveal">
      <button class="ku-projects__nav ku-projects__nav--prev" type="button" aria-label="Предыдущая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.41 12l5.3 5.3a1 1 0 0 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.41 0Z"/></svg></button>
      <div class="ku-projects__viewport">
        <div class="ku-projects__track">
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview ku-project-card__preview--ratio-4-3">
              <img src="media/portfolio/Scratch/1-poster.webp" data-gif-src="media/portfolio/Scratch/1.gif" alt="Gravity rush — Кира, 8 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Gravity rush</h3>
              <div class="ku-project-card__meta"><span>Кира</span><span>8 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--violet ku-projects__reveal">
            <div class="ku-project-card__preview ku-project-card__preview--ratio-4-3">
              <img src="media/portfolio/Scratch/2-poster.webp" data-gif-src="media/portfolio/Scratch/2.gif" alt="Minecraft — Артем, 9 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Minecraft</h3>
              <div class="ku-project-card__meta"><span>Артем</span><span>9 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--orange ku-projects__reveal">
            <div class="ku-project-card__preview ku-project-card__preview--ratio-4-3">
              <img src="media/portfolio/Scratch/3-poster.webp" data-gif-src="media/portfolio/Scratch/3.gif" alt="Перебеги дорогу — Александра, 8 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Перебеги дорогу</h3>
              <div class="ku-project-card__meta"><span>Александра</span><span>8 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview ku-project-card__preview--ratio-4-3">
              <img src="media/portfolio/Scratch/4-poster.webp" data-gif-src="media/portfolio/Scratch/4.gif" alt="Bubble pop — Артемий, 7 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Bubble pop</h3>
              <div class="ku-project-card__meta"><span>Артемий</span><span>7 лет</span></div>
            </div>
          </article>
        </div>
      </div>
      <button class="ku-projects__nav ku-projects__nav--next" type="button" aria-label="Следующая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 18.7a1 1 0 0 1 0-1.4l5.29-5.3L9.3 6.7a1 1 0 1 1 1.42-1.4l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-1.41 0Z"/></svg></button>
    </div>
    <div class="ku-projects__dots" aria-label="Навигация по работам"></div>
  </div>
</section>
