<section class="ku-projects ku-projects--student-portfolio" id="unity-projects">
  <div class="ku-projects__gridbg"></div>
  <div class="ku-projects__glow ku-projects__glow--blue"></div>
  <div class="ku-projects__glow ku-projects__glow--red"></div>

  <div class="ku-projects__container">
    <div class="ku-projects__head ku-projects__reveal">
      <div class="ku-projects__badge">Портфолио курса Unity</div>
      <h2 class="ku-projects__title">Портфолио <span>учеников Unity</span></h2>
      <p class="ku-projects__text">Примеры игр и 3D-сцен, где дети пробуют механику, физику, уровни и финальную сборку проекта.</p>
    </div>

    <div class="ku-projects__slider ku-projects__reveal">
      <button class="ku-projects__nav ku-projects__nav--prev" type="button" aria-label="Предыдущая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.41 12l5.3 5.3a1 1 0 0 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.41 0Z"/></svg></button>
      <div class="ku-projects__viewport">
        <div class="ku-projects__track">
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/unity/1-poster.webp" data-gif-src="media/portfolio/unity/1.gif" alt="Платформер — Екатерина, 14 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Платформер</h3>
              <div class="ku-project-card__meta"><span>Екатерина</span><span>14 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--violet ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/unity/2-poster.webp" data-gif-src="media/portfolio/unity/2.gif" alt="3D головоломка — Александр, 13 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>3D головоломка</h3>
              <div class="ku-project-card__meta"><span>Александр</span><span>13 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--orange ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/unity/3-poster.webp" data-gif-src="media/portfolio/unity/3.gif" alt="RPG игра — Евгений, 14 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>RPG игра</h3>
              <div class="ku-project-card__meta"><span>Евгений</span><span>14 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/unity/4-poster.webp" data-gif-src="media/portfolio/unity/4.gif" alt="Планета &quot;Ортос&quot; — Иван, 12 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Планета &quot;Ортос&quot;</h3>
              <div class="ku-project-card__meta"><span>Иван</span><span>12 лет</span></div>
            </div>
          </article>
        </div>
      </div>
      <button class="ku-projects__nav ku-projects__nav--next" type="button" aria-label="Следующая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 18.7a1 1 0 0 1 0-1.4l5.29-5.3L9.3 6.7a1 1 0 1 1 1.42-1.4l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-1.41 0Z"/></svg></button>
    </div>
    <div class="ku-projects__dots" aria-label="Навигация по работам"></div>
  </div>
</section>
