<section class="ku-projects ku-projects--student-portfolio" id="roblox-projects">
  <div class="ku-projects__gridbg"></div>
  <div class="ku-projects__glow ku-projects__glow--blue"></div>
  <div class="ku-projects__glow ku-projects__glow--red"></div>

  <div class="ku-projects__container">
    <div class="ku-projects__head ku-projects__reveal">
      <div class="ku-projects__badge">Портфолио курса Roblox</div>
      <h2 class="ku-projects__title">Игры, которые <span>создают дети</span></h2>
      <p class="ku-projects__text">Работы учеников в Roblox Studio: obby, игровые события, интерактивные миры и собственные правила.</p>
    </div>

    <div class="ku-projects__slider ku-projects__reveal">
      <button class="ku-projects__nav ku-projects__nav--prev" type="button" aria-label="Предыдущая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.41 12l5.3 5.3a1 1 0 0 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.41 0Z"/></svg></button>
      <div class="ku-projects__viewport">
        <div class="ku-projects__track">
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/roblox_program/1-poster.webp" data-gif-src="media/portfolio/roblox_program/1.gif" alt="Зомби-экшен — Богдан, 10 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Зомби-экшен</h3>
              <div class="ku-project-card__meta"><span>Богдан</span><span>10 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--violet ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/roblox_program/2-poster.webp" data-gif-src="media/portfolio/roblox_program/2.gif" alt="Игра &quot;Прятки&quot; — Анна, 12 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Игра &quot;Прятки&quot;</h3>
              <div class="ku-project-card__meta"><span>Анна</span><span>12 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--orange ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/roblox_program/3-poster.webp" data-gif-src="media/portfolio/roblox_program/3.gif" alt="Obby — Дамир, 9 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Obby</h3>
              <div class="ku-project-card__meta"><span>Дамир</span><span>9 лет</span></div>
            </div>
          </article>
          <article class="ku-project-card ku-project-card--blue ku-projects__reveal">
            <div class="ku-project-card__preview">
              <img src="media/portfolio/roblox_program/4-poster.webp" data-gif-src="media/portfolio/roblox_program/4.gif" alt="Пол это лава — Владимир, 10 лет" loading="lazy" decoding="async">
            </div>
            <div class="ku-project-card__body">
              <h3>Пол это лава</h3>
              <div class="ku-project-card__meta"><span>Владимир</span><span>10 лет</span></div>
            </div>
          </article>
        </div>
      </div>
      <button class="ku-projects__nav ku-projects__nav--next" type="button" aria-label="Следующая работа"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 18.7a1 1 0 0 1 0-1.4l5.29-5.3L9.3 6.7a1 1 0 1 1 1.42-1.4l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-1.41 0Z"/></svg></button>
    </div>
    <div class="ku-projects__dots" aria-label="Навигация по работам"></div>
  </div>
</section>
